apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    cerebro.k8s.webcenter.fr: "true"
  labels:
    cerebro.k8s.webcenter.fr: "true"
    cluster: test
  name: test-cb
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      cerebro.k8s.webcenter.fr: "true"
      cluster: test
  strategy: {}
  template:
    metadata:
      annotations:
        cerebro.k8s.webcenter.fr: "true"
        cerebro.k8s.webcenter.fr/configmap-test-config-cb: 4677e065adcece668a79cf48025751d600fb28898b195e198a263f76fa015660
        cerebro.k8s.webcenter.fr/secret-keystore: e0254a8990817d8a00deb6123c4a2a7ea7ae48428a65d9514257b3baedc1fb6e
      labels:
        cerebro.k8s.webcenter.fr: "true"
        cluster: test
      name: test-cb
    spec:
      containers:
      - args:
        - --config
        - /opt/cerebro/conf/application.yaml
        env:
        - name: env1
          value: value1
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: CEREBRO_SECRET
          valueFrom:
            secretKeyRef:
              key: session-key
              name: test-application-cb
        envFrom:
        - configMapRef:
            name: test
        image: ghcr.io/disaster37/cerebro:v0.1.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /favicon.ico
            port: 9000
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: cerebro
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /favicon.ico
            port: 9000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "4"
            memory: 4Gi
          requests:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 9000
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /opt/cerebro/conf
          name: config
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        project: kibana
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: project
        operator: Equal
        value: kibana
      volumes:
      - configMap:
          name: test-config-cb
        name: config
      - emptyDir: {}
        name: data
      - emptyDir: {}
        name: tmp
status: {}
