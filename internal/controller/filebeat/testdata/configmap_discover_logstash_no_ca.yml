apiVersion: v1
data:
  filebeat.yml: |
    filebeat:
        config:
            modules:
                path: ${path.config}/modules.d/*.yml
    http:
        enabled: true
        host: 0.0.0.0
    output:
        logstash:
            enabled: true
            hosts:
                - ${LOGSTASH_HOSTS_TEST_LOGSTASH}
            loadbalance: true
            ssl:
                enabled: false
kind: ConfigMap
metadata:
  annotations:
    filebeat.k8s.webcenter.fr: "true"
  labels:
    cluster: test
    filebeat.k8s.webcenter.fr: "true"
  name: test-config-fb
  namespace: default
